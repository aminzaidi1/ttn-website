<!-- @dsCard group="Type" viewport="700x230" name="Body & UI — Inter" subtitle="Body 1.7 line-height, UI labels 0.04em tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--ttn-black); font-family:var(--font-body); color:var(--ttn-white); padding:22px 28px; }
  .item { display:flex; align-items:baseline; gap:14px; margin-bottom:12px; }
  .spec { font-size:11px; color:var(--ttn-grey); white-space:nowrap; margin-left:auto; }
  .lg { font-size:18px; }
  .bd { font-size:16px; line-height:1.7; max-width:60ch; color:var(--ttn-white); }
  .ui { font-size:14px; font-weight:500; letter-spacing:0.04em; }
  .cap { font-size:13px; color:var(--ttn-grey); }
  .micro { font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--ttn-gold); }
</style>
</head>
<body>
  <div class="item"><span class="lg">Lead paragraph for article intros.</span><span class="spec">Body Large · 18px</span></div>
  <div class="item"><span class="bd">Standard body copy sets at sixteen pixels with generous line height for long-form reading.</span><span class="spec">Body · 16px · 1.7</span></div>
  <div class="item"><span class="ui">Destinations</span><span class="spec">UI / Label · 14px · 500</span></div>
  <div class="item"><span class="cap">Kharfaq Lake, Gilgit-Baltistan</span><span class="spec">Caption · 13px</span></div>
  <div class="item"><span class="micro">TTN Certified</span><span class="spec">Micro · 11px</span></div>
</body>
</html>
