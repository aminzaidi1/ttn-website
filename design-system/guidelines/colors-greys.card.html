<!-- @dsCard group="Colors" viewport="700x180" name="Greys & accents" subtitle="Secondary text, dividers, sparing green, error" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--ttn-black); font-family:var(--font-body); }
  .wrap { display:flex; gap:0; padding:20px; }
  .sw { flex:1; height:120px; display:flex; flex-direction:column; justify-content:flex-end; padding:12px; box-sizing:border-box; border:1px solid var(--ttn-slate); }
  .name { font-size:12px; font-weight:600; color:var(--ttn-white); letter-spacing:0.02em; }
  .hex { font-size:11px; color:var(--ttn-grey); margin-top:2px; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw" style="background:#8A8A8A"><span class="name" style="color:#0A0A0A">TTN Grey</span><span class="hex" style="color:#0A0A0A">#8A8A8A</span></div>
    <div class="sw" style="background:#1E1E1E"><span class="name">TTN Slate</span><span class="hex">#1E1E1E</span></div>
    <div class="sw" style="background:#333333"><span class="name">Border Lift</span><span class="hex">#333333</span></div>
    <div class="sw" style="background:#1A3A1A"><span class="name">TTN Green</span><span class="hex">#1A3A1A</span></div>
    <div class="sw" style="background:#E2553D"><span class="name" style="color:#0A0A0A">Error</span><span class="hex" style="color:#0A0A0A">#E2553D</span></div>
  </div>
</body>
</html>
