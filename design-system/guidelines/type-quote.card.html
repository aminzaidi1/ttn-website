<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--ttn-deep); font-family:var(--font-body); padding:28px 32px; }
  blockquote { margin:0; border-left:3px solid var(--ttn-gold); padding-left:20px; }
  .q { font-family:var(--font-display); font-style:italic; font-weight:400; font-size:22px; line-height:1.4; color:var(--ttn-white); max-width:50ch; }
  .by { font-size:13px; color:var(--ttn-grey); margin-top:12px; }
</style>
</head>
<body>
  <blockquote>
    <div class="q">The road past Chilas is not a shortcut. It is the reason you came.</div>
    <div class="by">Waseem, To The North Community</div>
  </blockquote>
</body>
</html>
