<!-- @dsCard group="Spacing" viewport="700x190" name="Radii & borders" subtitle="Sharp brand — small radii, borders not shadows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--ttn-black); font-family:var(--font-body); color:var(--ttn-white); padding:24px; }
  .wrap { display:flex; gap:24px; align-items:flex-end; }
  .item { display:flex; flex-direction:column; gap:10px; align-items:center; }
  .box { width:96px; height:72px; background:var(--ttn-deep); border:1px solid var(--ttn-slate); }
  .lab { font-size:12px; color:var(--ttn-white); font-weight:500; }
  .val { font-size:11px; color:var(--ttn-grey); }
  .gold { border-color:var(--ttn-gold); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="item"><div class="box" style="border-radius:4px"></div><span class="lab">Button / Input</span><span class="val">radius 4px</span></div>
    <div class="item"><div class="box" style="border-radius:6px"></div><span class="lab">Card</span><span class="val">radius 6px</span></div>
    <div class="item"><div class="box" style="border-radius:999px; width:120px"></div><span class="lab">Pill / Tag</span><span class="val">radius 999px</span></div>
    <div class="item"><div class="box gold" style="border-radius:6px"></div><span class="lab">Certified</span><span class="val">1px gold border</span></div>
  </div>
</body>
</html>
