<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="8px base unit, geometric steps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--ttn-black); font-family:var(--font-body); color:var(--ttn-white); padding:20px 28px; }
  .row { display:flex; align-items:center; gap:14px; margin-bottom:9px; }
  .bar { height:14px; background:var(--ttn-gold); }
  .tok { font-size:12px; width:78px; color:var(--ttn-white); font-weight:500; }
  .val { font-size:11px; color:var(--ttn-grey); width:48px; text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <div class="row"><span class="tok">space-1</span><span class="val">8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="tok">space-2</span><span class="val">16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="tok">space-3</span><span class="val">24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="tok">space-4</span><span class="val">32px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="tok">space-6</span><span class="val">48px</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="tok">space-8</span><span class="val">64px</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="tok">space-12</span><span class="val">96px</span><div class="bar" style="width:96px"></div></div>
  <div class="row"><span class="tok">space-16</span><span class="val">128px</span><div class="bar" style="width:128px"></div></div>
</body>
</html>
