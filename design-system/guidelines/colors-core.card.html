<!-- @dsCard group="Colors" viewport="700x180" name="Core palette" subtitle="Near-black surfaces, gold the only warm accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--ttn-black); font-family:var(--font-body); }
  .wrap { display:flex; gap:0; padding:20px; }
  .sw { flex:1; height:120px; display:flex; flex-direction:column; justify-content:flex-end; padding:12px; box-sizing:border-box; }
  .name { font-size:12px; font-weight:600; color:var(--ttn-white); letter-spacing:0.02em; }
  .hex { font-size:11px; color:var(--ttn-grey); margin-top:2px; font-variant-numeric:tabular-nums; }
  .b { border:1px solid var(--ttn-slate); }
  .b-light .name, .b-light .hex { color:var(--ttn-black); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw b" style="background:#0A0A0A"><span class="name">TTN Black</span><span class="hex">#0A0A0A</span></div>
    <div class="sw b" style="background:#111111"><span class="name">TTN Deep</span><span class="hex">#111111</span></div>
    <div class="sw b-light" style="background:#F5A623"><span class="name" style="color:#0A0A0A">TTN Gold</span><span class="hex" style="color:#0A0A0A">#F5A623</span></div>
    <div class="sw b-light" style="background:#C47D0E"><span class="name" style="color:#0A0A0A">TTN Amber</span><span class="hex" style="color:#0A0A0A">#C47D0E</span></div>
    <div class="sw b-light" style="background:#F5F5F0"><span class="name" style="color:#0A0A0A">TTN White</span><span class="hex" style="color:#0A0A0A">#F5F5F0</span></div>
  </div>
</body>
</html>
