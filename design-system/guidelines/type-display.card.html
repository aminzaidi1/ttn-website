<!-- @dsCard group="Type" viewport="700x220" name="Display — Playfair" subtitle="Hero / section / card titles, sentence case" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; background:var(--ttn-black); font-family:var(--font-display); color:var(--ttn-white); padding:24px 28px; }
  .row { display:flex; align-items:baseline; gap:16px; margin-bottom:14px; }
  .spec { font-family:var(--font-body); font-size:11px; color:var(--ttn-grey); white-space:nowrap; }
  .hero { font-weight:900; font-size:56px; line-height:1.1; letter-spacing:-0.02em; }
  .sec { font-weight:700; font-size:40px; line-height:1.15; letter-spacing:-0.02em; }
  .card { font-weight:700; font-size:26px; }
</style>
</head>
<body>
  <div class="row"><span class="hero">To the north</span></div>
  <div class="row"><span class="sec">Stories from the peaks</span><span class="spec">Section · 700 · 40px</span></div>
  <div class="row"><span class="card">Kharfaq Lake at first light</span><span class="spec">Card · 700 · 26px</span></div>
</body>
</html>
