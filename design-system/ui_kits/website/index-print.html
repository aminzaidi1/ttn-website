<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>To The North</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ttn-black); }
  ::selection { background: var(--ttn-gold); color: var(--ttn-black); }

  .ttn-g2, .ttn-g3, .ttn-g4 { display: grid; gap: var(--space-4); }
  .ttn-g2 { grid-template-columns: repeat(2, 1fr); }
  .ttn-g3 { grid-template-columns: repeat(3, 1fr); }
  .ttn-g4 { grid-template-columns: repeat(4, 1fr); }
  .ttn-split { display: grid; grid-template-columns: 1fr 1.2fr; gap: var(--space-8); align-items: center; }

  .ttn-inner { max-width: var(--w-max); margin: 0 auto; padding: 0 var(--gutter-desktop); }

  .ttn-nav-desktop { display: flex; }
  .ttn-nav-burger { display: none; }

  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: letter; margin: 0; }
    body { padding: 0; }
    header[style*="sticky"], header { position: static !important; }
    section[style*="min-height: 88vh"], section[style*="minHeight"] { min-height: auto !important; page-break-inside: avoid; }
    h1, h2 { break-after: avoid; }
    .ttn-g2 > *, .ttn-g3 > *, .ttn-g4 > * { break-inside: avoid; }
    p { orphans: 3; widows: 3; }
    *, *::before, *::after {
      animation-delay: -99s !important; animation-duration: .001s !important;
      animation-iteration-count: 1 !important; animation-fill-mode: both !important;
      animation-play-state: running !important; transition-duration: 0s !important;
    }
  }
</style>
</head>
<body style="background-color: rgb(255, 255, 255)">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="chrome.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel">
    const { TTN_Nav, TTN_Footer, TTN_HomeScreen } = window;

    function App() {
      const navigate = () => {};
      const openStory = () => {};
      return (
        <div>
          <TTN_Nav active="Home" onNavigate={navigate} />
          <TTN_HomeScreen onNavigate={navigate} onOpenStory={openStory} />
          <TTN_Footer onNavigate={navigate} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script>
    addEventListener('load', () => {
      (async () => {
        try { await document.fonts.ready; } catch (e) {}
        const waitForContent = () => new Promise((resolve) => {
          const check = () => {
            const root = document.getElementById('root');
            if (root && root.children.length > 0) resolve();
            else setTimeout(check, 100);
          };
          check();
        });
        await Promise.race([waitForContent(), new Promise((r) => setTimeout(r, 5000))]);
        const imgs = Array.from(document.images).filter((i) => !i.complete);
        await Promise.race([
          Promise.allSettled(imgs.map((i) => i.decode())),
          new Promise((r) => setTimeout(r, 8000)),
        ]);
        setTimeout(() => window.print(), 500);
      })();
    });
  </script>
</body>
</html>
